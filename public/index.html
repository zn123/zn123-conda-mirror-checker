<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>conda 镜像源检测</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>conda 镜像源状态检测</h1>
    <p class="sub">实时探测各镜像源的 repodata 索引与 python 包下载可用性</p>
  </header>

  <section class="controls">
    <label>平台：
      <select id="platform">
        <option value="win-64">win-64</option>
        <option value="linux-64">linux-64</option>
        <option value="osx-64">osx-64</option>
        <option value="osx-arm64">osx-arm64</option>
      </select>
    </label>
    <label>Python：
      <select id="python">
        <option value="3.14">3.14</option>
        <option value="3.13">3.13</option>
        <option value="3.12" selected>3.12</option>
        <option value="3.11">3.11</option>
        <option value="3.10">3.10</option>
        <option value="3.8">3.8</option>
      </select>
    </label>
    <button id="checkBtn">开始检测</button>
    <span id="status" class="status"></span>
    <span id="summary" class="summary"></span>
  </section>

  <main>
    <table id="result">
      <thead>
        <tr>
          <th>镜像源</th>
          <th>索引 repodata</th>
          <th>包下载 pkg</th>
          <th>延迟</th>
          <th>状态</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <section class="logs">
    <details id="logPanel" open>
      <summary>探测日志 <span id="logCount" class="muted"></span></summary>
      <div id="logBody" class="log-body"></div>
    </details>
    <button id="downloadLog" type="button" class="link-btn" hidden>下载本次日志</button>
  </section>

  <footer>
    <p>探测逻辑：① 完整拉取 <code>current_repodata.json</code> 验证是否为合法 JSON，并解析该源 python 的真实版本与包名；② 对该真实包发 Range 请求验证可下载（命中 502 / 403 / HTML 门户即判故障）；③ 对照你选择的 Python 版本，标注该源是否已同步。</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
